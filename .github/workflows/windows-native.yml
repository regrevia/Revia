name: Windows x64 native conformance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-build:
    name: Build and test Windows x64 native source
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check Windows toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) { throw 'cargo unavailable' }
          if (-not (Get-Command rustc -ErrorAction SilentlyContinue)) { throw 'rustc unavailable' }
          $PSVersionTable
          rustc --version
          cargo --version

      - name: Build native release binary
        shell: pwsh
        working-directory: native
        run: cargo build --workspace --release --locked

      - name: Run bounded Windows loopback server smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'native/target/release/revia.exe'
          $output = & $exe server-smoke 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -ne 0) { throw "server-smoke failed: $code" }

      - name: Run native workspace tests
        shell: pwsh
        working-directory: native
        run: cargo test --workspace --release --locked

      - name: Verify build target and record executable digest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'native/target/release/revia.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "missing native executable: $exe"
          }

          $identity = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          if ($identity -ne 'X64') {
            throw "expected Windows x64 runner, got $identity"
          }

          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "windows-x64 source-built executable sha256=$hash"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "version failed: $LASTEXITCODE" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "help failed: $LASTEXITCODE" }
          & $exe check examples/hello.re
          if ($LASTEXITCODE -ne 0) { throw "check failed: $LASTEXITCODE" }
          $manifest = & $exe manifest examples/hello.re | Out-String
          if ($LASTEXITCODE -ne 0 -or $manifest -notmatch 'graph_revision') {
            throw 'manifest smoke failed'
          }

      - name: Upload source-built Windows x64 executable
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: revia-windows-x64-source-build
          if-no-files-found: error
          path: native/target/release/revia.exe

  windows-x64-bound-runner:
    name: Execute Windows x64 binary on regrevia-win
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: windows-x64-build
    runs-on: [self-hosted, Windows, X64, regrevia-win]
    timeout-minutes: 15
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download source-built Windows executable
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          name: revia-windows-x64-source-build
          path: incoming

      - name: Execute source-built binary on bound Windows x64 node
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') {
            throw 'Windows x64 runner required'
          }
          $exe = 'incoming/revia.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'source-built executable missing' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "regrevia-win executable sha256=$hash"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "version failed: $LASTEXITCODE" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "help failed: $LASTEXITCODE" }
          & $exe check examples/hello.re
          if ($LASTEXITCODE -ne 0) { throw "check failed: $LASTEXITCODE" }
          $manifest = & $exe manifest examples/hello.re | Out-String
          if ($LASTEXITCODE -ne 0 -or $manifest -notmatch 'graph_revision') {
            throw 'manifest smoke failed'
          }
