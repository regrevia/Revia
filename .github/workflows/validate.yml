name: Source and release validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: source-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node source and privacy checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.16.0', '22']
    steps:
      # Full history, because `test/public-source-transition.test.js` walks every
      # commit to compare what each one stored against the manifest it carried. The
      # default depth-1 clone would make that test a skip, and a skip on every push
      # is a claim nobody measures.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install pinned Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify import manifest and public boundary
        run: |
          npm run source:manifest
          sh scripts/validate-public-tree.sh
          gitleaks dir --redact .
      # Seven cases in test/docs-commands.test.js, test/docs-diagnostics.test.js,
      # test/project-template.test.js and test/release-compatibility-table.test.js
      # compare a page with the bytes the release binary prints. They skip when
      # that binary is absent or older than the sources it claims to describe,
      # which is the honest answer and also meant that a job that never built
      # one reported "not measured" for a claim it appeared to cover. Build it
      # here, from this checkout, before the suite runs, so that population is
      # the one that measured them. The native job runs the same build; the
      # duplication buys the Node lane its ability to check its own claims,
      # because an artifact built by another job could be older than the tree
      # this job checked out.
      - name: Build the release binary the documented claims measure
        run: cargo build --workspace --release --offline
        working-directory: native
      - name: Run Node conformance suite
        shell: bash
        run: |
          set +e
          evidence_dir="$RUNNER_TEMP/revia-node-test-population"
          mkdir -p "$evidence_dir"
          : > "$evidence_dir/node-test-runner.error"
          node scripts/run-tracked-tests.js > "$evidence_dir/node-test-population.json" 2> "$evidence_dir/node-test-execution.log"
          status=$?
          if [ "$status" -ne 0 ] && [ ! -s "$evidence_dir/node-test-population.json" ]; then
            printf '%s\n' "node-test-runner exited with status $status" > "$evidence_dir/node-test-runner.error"
          fi
          exit "$status"
      - name: Upload Node population evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: node-test-population-${{ matrix.node-version }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/revia-node-test-population/node-test-population.json
            ${{ runner.temp }}/revia-node-test-population/node-test-execution.log
            ${{ runner.temp }}/revia-node-test-population/node-test-runner.error

  native:
    name: Native Rust conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: native
      - name: Build release binary for release-evidence tests
        run: cargo build --workspace --release --offline
        working-directory: native
      - name: Run offline workspace tests
        run: cargo test --workspace --offline
        working-directory: native
      - name: Run clippy
        run: cargo clippy --workspace --offline --all-targets -- -D warnings
        working-directory: native
