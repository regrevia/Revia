name: Source and release validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node source and privacy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pinned Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify import manifest and public boundary
        run: |
          npm run source:manifest
          sh scripts/validate-public-tree.sh
          gitleaks dir --redact .
      - name: Run Node conformance suite
        run: npm test

  native:
    name: Native Rust conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: native
      - name: Run offline workspace tests
        run: cargo test --workspace --offline
        working-directory: native
      - name: Run clippy
        run: cargo clippy --workspace --offline --all-targets -- -D warnings
        working-directory: native
