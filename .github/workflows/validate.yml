name: Source and release validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node source and privacy checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.16.0', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install pinned Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify import manifest and public boundary
        run: |
          npm run source:manifest
          sh scripts/validate-public-tree.sh
          gitleaks dir --redact .
      - name: Run Node conformance suite
        shell: bash
        run: |
          set +e
          : > node-test-runner.error
          node scripts/run-tracked-tests.js > node-test-population.json 2> node-test-execution.log
          status=$?
          if [ "$status" -ne 0 ] && [ ! -s node-test-population.json ]; then
            printf '%s\n' "node-test-runner exited with status $status" > node-test-runner.error
          fi
          exit "$status"
      - name: Upload Node population evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: node-test-population-${{ matrix.node-version }}
          if-no-files-found: error
          path: |
            node-test-population.json
            node-test-execution.log
            node-test-runner.error

  native:
    name: Native Rust conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: native
      - name: Build release binary for release-evidence tests
        run: cargo build --workspace --release --offline
        working-directory: native
      - name: Run offline workspace tests
        run: cargo test --workspace --offline
        working-directory: native
      - name: Run clippy
        run: cargo clippy --workspace --offline --all-targets -- -D warnings
        working-directory: native
