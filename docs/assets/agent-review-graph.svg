<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1200" height="640" viewBox="0 0 1200 640">
  <title id="title">Revia semantic graph review</title>
  <desc id="desc">A compact presentation of the semantic facts emitted by the Revia translator for the agent review example.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .sans { font-family: Inter, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 15px; fill: #475569; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; }
      .value { font-size: 21px; font-weight: 650; fill: #0f172a; }
      .detail { font-size: 13px; fill: #475569; }
      .small { font-size: 12px; fill: #64748b; }
      .line { stroke: #cbd5e1; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="64" y="74" class="sans title">From .re to reviewable semantics</text>
  <text x="64" y="105" class="sans subtitle">A compact view of facts emitted by the Revia translator</text>
  <text x="1136" y="76" text-anchor="end" class="mono small">@agent_review</text>
  <text x="1136" y="99" text-anchor="end" class="mono small">examples/agent-review/main.re</text>
  <line x1="64" y1="132" x2="1136" y2="132" stroke="#e2e8f0"/>

  <line x1="314" y1="274" x2="390" y2="274" class="line"/>
  <line x1="684" y1="274" x2="760" y2="213" class="line"/>
  <line x1="684" y1="274" x2="760" y2="386" class="line"/>

  <rect x="64" y="192" width="250" height="164" fill="#f8fbff" stroke="#93c5fd"/>
  <text x="88" y="226" class="sans label" fill="#2563eb">CAPABILITY</text>
  <text x="88" y="270" class="mono value">@stdout</text>
  <text x="88" y="302" class="mono detail">process.stdout@0.1.0</text>
  <text x="88" y="334" class="sans detail">explicit external authority</text>

  <rect x="390" y="192" width="294" height="164" fill="#fffdf5" stroke="#facc15"/>
  <text x="414" y="226" class="sans label" fill="#a16207">EFFECT</text>
  <text x="414" y="270" class="mono value">@stdout.write</text>
  <text x="414" y="302" class="mono detail">result&lt;unit, io.write_error&gt;</text>
  <text x="414" y="334" class="sans detail">effect result stays visible</text>

  <rect x="760" y="150" width="376" height="126" fill="#f4fcf7" stroke="#86efac"/>
  <text x="784" y="184" class="sans label" fill="#15803d">SUCCESS PATH</text>
  <text x="784" y="226" class="mono value">ok(_) → process.exit(0)</text>
  <text x="784" y="252" class="sans detail">the handoff completes</text>

  <rect x="760" y="332" width="376" height="126" fill="#fff7f7" stroke="#fda4af"/>
  <text x="784" y="366" class="sans label" fill="#be123c">FAILURE PATH</text>
  <text x="784" y="408" class="mono value">err(_) → process.exit(1)</text>
  <text x="784" y="434" class="sans detail">the write error remains reviewable</text>

  <rect x="64" y="514" width="1072" height="64" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="88" y="541" class="sans label" fill="#64748b">TRANSLATION</text>
  <text x="88" y="563" class="sans detail">Generated from the source program by the Revia translator; inspect the full machine contract with manifest.</text>
</svg>
